name = "shc-clientes-sso"
main = "src/index.js"
compatibility_date = "2026-08-06"

# Aquí se podrá enrutar: clientes.shcdigital.net.ar/*
# (ruta DNS en Cloudflare → este Worker)

# Sesiones del SSO (login + estado OAuth)
[[kv_namespaces]]
binding = "SESSIONS"
id = "PENDIENTE_REEMPLAZAR_CON_KV_ID"

[vars]
APP_NAME = "SHC Digital — Clientes"
BASE_URL = "https://clientes.shcdigital.net.ar"

# Tenants: cada cliente → su panel-admin (Worker) autenticado por este SSO.
#   id       : identifica al tenant (va como claim "aud" del JWT).
#   name     : nombre visible en la pantalla de bienvenida.
#   admin_url: URL raíz del panel del cliente (debe implementar /auth/sso).
#   emails   : correos permitidos vía Google OAuth para ese tenant.
TENANTS = '[{"id":"geo-graficas","name":"Geo.Gráficas","admin_url":"https://geo-graficas-admin.tudominio.workers.dev","emails":[]}]'

# Login local de prueba (hash PBKDF2-SHA256, 100000 iter). NO la contraseña en claro.
LOCAL_USER = "admin"
LOCAL_SALT_B64 = "KsrlBfUBAqQ62M/TEtg4Sg=="
LOCAL_HASH_B64 = "+5y20pN7PYv5NuYAka20kaiHk6ptxuZOtNfp04CB4ig="