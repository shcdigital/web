name = "shc-briefing-api"
main = "src/index.js"
compatibility_date = "2026-08-06"

[observability]
enabled = true

[[routes]]
pattern = "briefing-api.shcdigital.net.ar"
custom_domain = true

# Rate-limit anti-abuso (bomba de emails): contadores por IP en KV.
[[kv_namespaces]]
binding = "SHC_RATELIMIT"
id = "6ea7e09083a946c8bea864bfd3fb2f6b"

[vars]
# Destinatario de los briefings
TO_EMAIL = "shcdigitalsolutions@gmail.com"

# Remitente. Por defecto onboarding@resend.dev (solo puede enviar a la cuenta
# dueña). Cuando verifiqués un dominio en Resend, activá y personalizá:
# FROM_EMAIL = "SHC Digital <noreply@shcdigital.net.ar>"
